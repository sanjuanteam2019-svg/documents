<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Billing Documents</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .controls { margin-bottom: 20px; }
    .controls select, .controls input { margin-right: 10px; }
    .document { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
    .document h3 { margin: 0; }
  </style>
</head>
<body>

  <h1>Billing Documents</h1>

  <div class="controls">
    <input type="text" id="search" placeholder="Search by title...">
    <select id="status">
      <option value="">All Status</option>
      <option value="paid">Paid</option>
      <option value="unpaid">Unpaid</option>
    </select>
    <select id="category">
      <option value="">All Categories</option>
      <option value="invoice">Invoice</option>
      <option value="receipt">Receipt</option>
    </select>
    <select id="trade">
      <option value="">All Trades</option>
      <option value="domestic">Domestic</option>
      <option value="international">International</option>
    </select>
    <select id="sort">
      <option value="">Sort By</option>
      <option value="date-asc">Date Ascending</option>
      <option value="date-desc">Date Descending</option>
      <option value="doc-asc">Doc No Ascending</option>
      <option value="doc-desc">Doc No Descending</option>
      <option value="title-asc">Title Ascending</option>
      <option value="title-desc">Title Descending</option>
    </select>
  </div>

  <div id="document-list"></div>

  <script>
    const documents = [
      { docNo: "INV001", title: "Website Design", date: "2026-07-15", status: "paid", category: "invoice", trade: "domestic" },
      { docNo: "REC002", title: "Hosting Fee", date: "2026-07-20", status: "unpaid", category: "receipt", trade: "international" },
      { docNo: "INV003", title: "Consulting", date: "2026-07-10", status: "paid", category: "invoice", trade: "domestic" }
    ];

    const search = document.getElementById("search");
    const status = document.getElementById("status");
    const category = document.getElementById("category");
    const trade = document.getElementById("trade");
    const sort = document.getElementById("sort");
    const list = document.getElementById("document-list");

    function displayDocuments(docs) {
      list.innerHTML = "";
      docs.forEach(doc => {
        const div = document.createElement("div");
        div.className = "document";
        div.innerHTML = `
          <h3>${doc.title}</h3>
          <p><strong>Doc No:</strong> ${doc.docNo}</p>
          <p><strong>Date:</strong> ${doc.date}</p>
          <p><strong>Status:</strong> ${doc.status}</p>
          <p><strong>Category:</strong> ${doc.category}</p>
          <p><strong>Trade:</strong> ${doc.trade}</p>
        `;
        list.appendChild(div);
      });
    }

    function filterDocuments() {
      let filtered = documents.filter(doc => {
        return (
          (search.value === "" || doc.title.toLowerCase().includes(search.value.toLowerCase())) &&
          (status.value === "" || doc.status === status.value) &&
          (category.value === "" || doc.category === category.value) &&
          (trade.value === "" || doc.trade === trade.value)
        );
      });

      switch (sort.value) {
        case "date-desc":
          filtered.sort((a,b)=>new Date(b.date)-new Date(a.date));
          break;
        case "date-asc":
          filtered.sort((a,b)=>new Date(a.date)-new Date(b.date));
          break;
        case "doc-asc":
          filtered.sort((a,b)=>a.docNo.localeCompare(b.docNo));
          break;
        case "doc-desc":
          filtered.sort((a,b)=>b.docNo.localeCompare(a.docNo));
          break;
        case "title-asc":
          filtered.sort((a,b)=>a.title.localeCompare(b.title));
          break;
        case "title-desc":
          filtered.sort((a,b)=>b.title.localeCompare(a.title));
          break;
      }

      displayDocuments(filtered);
    }

    search.addEventListener("keyup", filterDocuments);
    status.addEventListener("change", filterDocuments);
    category.addEventListener("change", filterDocuments);
    trade.addEventListener("change", filterDocuments);
    sort.addEventListener("change", filterDocuments);

    // Initial render
    displayDocuments(documents);
  </script>

</body>
</html>
