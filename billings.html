<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Billing</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Shared navigation -->
  <nav class="navbar">
    <ul>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="reports.html">Reports</a></li>
      <li><a href="billings.html">Billing</a></li>
      <li><a href="notifications.html">Notifications</a></li>
    </ul>
  </nav>

  <!-- Page header -->
  <header>
    <h1>Billing</h1>
  </header>

  <div class="container">
    <!-- Toolbar for filters -->
     <div class="toolbar">
      <input type="text" id="searchBox" placeholder="Search by title...">
      <select id="categoriesFilter">
        <option value="">All Categories</option>
        <option value="subcon">Subcon</option>
        <option value="utilities">Utilities</option>
      </select> 
    <div class="container">  
    <div class="toolbar">
      <input type="text" id="searchBox" placeholder="Search by title...">
      <select id="statusFilter">
        <option value="">All Status</option>
        <option value="approved">Approved</option>
        <option value="submitted">Submitted</option>
        <option value="transmitted">Transmitted</option>
        <option value="overdue">Overdue</option>
      </select>
      <select id="sortFilter">
        <option value="">Sort By</option>
        <option value="date-asc">Date Ascending</option>
        <option value="date-desc">Date Descending</option>
        <option value="doc-asc">Doc No Ascending</option>
        <option value="doc-desc">Doc No Descending</option>
        <option value="title-asc">Title Ascending</option>
        <option value="title-desc">Title Descending</option>
        <option value="amount-asc">Amount Ascending</option>
        <option value="amount-desc">Amount Descending</option>
      </select>
    </div>

    <!-- Table container -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Doc No</th>
            <th>Date</th>
            <th>Status</th>
            <th>Category</th>
            <th>Trade</th>
            <th>Amount</th>
            <th>File</th>
          </tr>
        </thead>
        <tbody id="document-list"></tbody>
      </table>
    </div>
  </div>

  <script>
    let documents = [];

    const searchBox = document.getElementById("searchBox");
    const statusFilter = document.getElementById("statusFilter");
    const sortFilter = document.getElementById("sortFilter");
    const list = document.getElementById("document-list");

    function displayDocuments(docs) {
      list.innerHTML = "";
      docs.forEach(doc => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${doc.title}</td>
          <td>${doc.docNo}</td>
          <td>${doc.date}</td>
          <td class="status-${doc.status}">${doc.status}</td>
          <td>${doc.category}</td>
          <td>${doc.trade}</td>
          <td>₱${doc.amount}</td>
          <td>
            <a href="${doc.file}" target="_blank" class="view-btn">View</a>
          </td>
        `;
        list.appendChild(row);
      });
    }

    function filterDocuments() {
      let filtered = documents.filter(doc => {
        return (
          (searchBox.value === "" || doc.title.toLowerCase().includes(searchBox.value.toLowerCase())) &&
          (statusFilter.value === "" || doc.status === statusFilter.value)
        );
      });

      switch (sortFilter.value) {
        case "date-desc":
          filtered.sort((a,b)=>new Date(b.date)-new Date(a.date));
          break;
        case "date-asc":
          filtered.sort((a,b)=>new Date(a.date)-new Date(b.date));
          break;
        case "doc-asc":
          filtered.sort((a,b)=>a.docNo.localeCompare(b.docNo));
          break;
        case "doc-desc":
          filtered.sort((a,b)=>b.docNo.localeCompare(a.docNo));
          break;
        case "title-asc":
          filtered.sort((a,b)=>a.title.localeCompare(b.title));
          break;
        case "title-desc":
          filtered.sort((a,b)=>b.title.localeCompare(a.title));
          break;
        case "amount-asc":
          filtered.sort((a,b)=>a.amount - b.amount);
          break;
        case "amount-desc":
          filtered.sort((a,b)=>b.amount - a.amount);
          break;
      }

      displayDocuments(filtered);
    }

    searchBox.addEventListener("keyup", filterDocuments);
    statusFilter.addEventListener("change", filterDocuments);
    sortFilter.addEventListener("change", filterDocuments);

    // Load data from data/billings.json
    fetch("data/billings.json")
      .then(response => response.json())
      .then(data => {
        documents = data;
        displayDocuments(documents);
      })
      .catch(err => console.error("Error loading billings.json:", err));
  </script>

</body>
</html>
