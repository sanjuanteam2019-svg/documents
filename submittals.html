<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submittals</title>
<link rel="stylesheet" href="css/style.css">
<style>
/* Status badge colors */
.status-A { background:#4CAF50; color:white; padding:4px 8px; border-radius:4px; }
.status-ASC { background:#2196F3; color:white; padding:4px 8px; border-radius:4px; }
.status-RR { background:#FF9800; color:white; padding:4px 8px; border-radius:4px; }
.status-Sup { background:#757575; color:white; padding:4px 8px; border-radius:4px; }
.status-Sub { background:#FFEB3B; color:black; padding:4px 8px; border-radius:4px; }
.status-TR { background:#9C27B0; color:white; padding:4px 8px; border-radius:4px; }
.status-P { background:#F44336; color:white; padding:4px 8px; border-radius:4px; }
</style>
</head>
<body>

<div class="sidebar">
  <img src="images/logo.png" alt="DEVEX" class="logo">
  <ul>
    <li><a href="dashboard.html" style="color:white;text-decoration:none;">🏠 Dashboard</a></li>
    <li><a href="projects.html" style="color:white;text-decoration:none;">📁 Projects</a></li>
    <li><a href="documents.html" style="color:white;text-decoration:none;">📄 Documents</a></li>
    <li>📄 Submittals</li>
    <li><a href="billings.html" style="color:white;text-decoration:none;">📄 Billings</a></li>
    <li><a href="reports.html" style="color:white;text-decoration:none;">📊 Reports</a></li>
    <li>⚙ Settings</li>
  </ul>
</div>

<div class="main">
  <div class="header">
    <h1>Project Submittals</h1>
    <h3>Welcome John</h3>
  </div>

  <!-- Upload Form -->
  <form id="uploadForm">
    <input type="text" name="title" placeholder="Title" required>
    <input type="text" name="description" placeholder="Description" required>
    <input type="file" name="file" required>
    <select name="ballInCourt">
      <option value="Engineer">Engineer (Originator)</option>
      <option value="DC">Document Controller (DC)</option>
      <option value="WTA">WTA (Consultant)</option>
    </select>
    <button type="submit">Submit</button>
  </form>

  <!-- Submittals Table -->
  <table>
    <thead>
      <tr>
        <th>Document No</th>
        <th>Title</th>
        <th>Revision</th>
        <th>Status</th>
        <th>Ball in Court</th>
        <th>File</th>
      </tr>
    </thead>
    <tbody id="docList"></tbody>
  </table>
</div>

<!-- Google API -->
<script src="https://apis.google.com/js/api.js"></script>
<script src="js/submittals.js"></script>
</body>
</html>
