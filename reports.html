<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reports Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h2 id="projectTitle">📄 Project Reports</h2>
  <a href="projects.html">⬅ Back to Projects</a>
</header>

<div class="toolbar">
  <input type="text" id="searchBox" placeholder="Search reports...">

  <select id="categoryFilter">
    <option value="">All Categories</option>
    <option value="Site Safety Incident Reports">Site Safety Incident Reports</option>
    <option value="Site Safety Observation Reports">Site Safety Observation Reports</option>
    <option value="Safety Corrective Action Reports">Safety Corrective Action Reports</option>
    <option value="Quality Control Reports">Quality Control Reports</option>
    <option value="Production Reports">Production Reports</option>
  </select>

  <select id="tradeFilter">
    <option value="">All Trades</option>
    <option value="Operations">Operations</option>
    <option value="Quality Control">Quality Control</option>
    <option value="Safety">Safety</option>
  </select>

  <select id="statusFilter">
    <option value="">All Statuses</option>
    <option value="Master Copy">Master Copy</option>
    <option value="Draft">Draft</option>
    <option value="Controlled Copy">Controlled Copy</option>
    <option value="Incomplete">Incomplete</option>
  </select>
</div>

<p id="recordCount"></p>

<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>Report No.</th>
        <th>Document Title</th>
        <th>Category</th>
        <th>Trade</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
let reports = [];

function displayReports(list) {
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";
  list.forEach(rep => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${rep.reportNo}</td>
      <td>${rep.title}</td>
      <td>${rep.category}</td>
      <td>${rep.trade}</td>
      <td>${rep.status}</td>
    `;
    tbody.appendChild(row);
  });
  document.getElementById("recordCount").textContent =
    `Showing ${list.length} of ${reports.length} reports`;
}

function filterReports() {
  const keyword = searchBox.value.toLowerCase();
  const cat = categoryFilter.value;
  const trade = tradeFilter.value;
  const status = statusFilter.value;

  const filtered = reports.filter(rep => {
    return (
      (keyword === "" || rep.title.toLowerCase().includes(keyword) || rep.reportNo.toLowerCase().includes(keyword)) &&
      (cat === "" || rep.category === cat) &&
      (trade === "" || rep.trade === trade) &&
      (status === "" || rep.status === status)
    );
  });

  displayReports(filtered);
}

const searchBox = document.getElementById("searchBox");
const categoryFilter = document.getElementById("categoryFilter");
const tradeFilter = document.getElementById("tradeFilter");
const statusFilter = document.getElementById("statusFilter");

searchBox.addEventListener("keyup", filterReports);
categoryFilter.addEventListener("change", filterReports);
tradeFilter.addEventListener("change", filterReports);
statusFilter.addEventListener("change", filterReports);

// Example: load from JSON file
fetch("data/reports.json")
  .then(res => res.json())
  .then(data => {
    reports = data;
    displayReports(reports);
  })
  .catch(err => console.error("Error loading reports:", err));
</script>

</body>
</html>
