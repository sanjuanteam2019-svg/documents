<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project Detailed Reports</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h2 id="projectTitle">📄 Project Detailed Reports</h2>
  <a href="reports.html">⬅ Back to Reports</a>
</header>

<div class="toolbar">
  <input type="text" id="searchBox" placeholder="Search reports...">

  <select id="categoryFilter">
    <option value="">All Categories</option>
    <option value="Site Safety Incident Reports">Site Safety Incident Reports</option>
    <option value="Site Safety Observation Reports">Site Safety Observation Reports</option>
    <option value="Safety Corrective Action Reports">Safety Corrective Action Reports</option>
    <option value="Quality Control Reports">Quality Control Reports</option>
    <option value="Production Reports">Production Reports</option>
  </select>

  <select id="tradeFilter">
    <option value="">All Trades</option>
    <option value="Operations">Operations</option>
    <option value="Quality Control">Quality Control</option>
    <option value="Safety">Safety</option>
  </select>

  <select id="statusFilter">
    <option value="">All Statuses</option>
    <option value="Master Copy">Master Copy</option>
    <option value="Draft">Draft</option>
    <option value="Controlled Copy">Controlled Copy</option>
    <option value="Incomplete">Incomplete</option>
  </select>
</div>

<p id="recordCount"></p>

<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>Report No.</th>
        <th>Document Title</th>
        <th>Category</th>
        <th>Trade</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
let documents = [];

const params = new URLSearchParams(window.location.search);
const project = params.get("project");

const projectNames = {
  "gcsj": "Government Center",
  "22-storey": "Multipurpose Building",
  "cluster3": "Cluster 3",
  "doh": "Department of Health",
  "evacuation": "Evacuation Center",
  "csj": "Crematorium San Juan"
};

document.getElementById("projectTitle").textContent =
  "📄 " + (projectNames[project] || "Project Reports");

if (!project) {
  alert("No project selected.");
  window.location.href = "reports.html";
}

fetch(`data/${project}.json`)
  .then(res => res.json())
  .then(data => {
    documents = data;
    displayDocuments(documents);
  })
  .catch(err => console.error("Error loading project data:", err));

function displayDocuments(list) {
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";
  list.forEach(doc => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${doc.reportNo}</td>
      <td>${doc.title}</td>
      <td>${doc.category}</td>
      <td>${doc.trade}</td>
      <td>${doc.status}</td>
    `;
    tbody.appendChild(row);
  });
  document.getElementById("recordCount").textContent =
    `Showing ${list.length} of ${documents.length} reports`;
}

function filterDocuments() {
  const keyword = searchBox.value.toLowerCase();
  const cat = categoryFilter.value;
  const trade = tradeFilter.value;
  const status = statusFilter.value;

  const filtered = documents.filter(doc => {
    return (
      (keyword === "" || doc.title.toLowerCase().includes(keyword) || doc.reportNo.toLowerCase().includes(keyword)) &&
      (cat === "" || doc.category === cat) &&
      (trade === "" || doc.trade === trade) &&
      (status === "" || doc.status === status)
    );
  });

  displayDocuments(filtered);
}

const searchBox = document.getElementById("searchBox");
const categoryFilter = document.getElementById("categoryFilter");
const tradeFilter = document.getElementById("tradeFilter");
const statusFilter = document.getElementById("statusFilter");

searchBox.addEventListener("keyup", filterDocuments);
categoryFilter.addEventListener("change", filterDocuments);
tradeFilter.addEventListener("change", filterDocuments);
statusFilter.addEventListener("change", filterDocuments);
</script>

</body>
</html>
